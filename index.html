<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grand Theft Auto VI - Early Access</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', sans-serif;
        }

        body {
            background: #0b0612 url('https://images.unsplash.com/photo-1518709268805-4e9042af9f23?q=80&w=1600&auto=format&fit=crop') no-repeat center center fixed;
            background-size: cover;
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, rgba(17, 10, 29, 0.88) 0%, rgba(10, 5, 18, 0.96) 100%);
            z-index: 1;
        }

        .card {
            position: relative;
            z-index: 2;
            background: rgba(18, 14, 27, 0.92);
            border: 1px solid rgba(255, 0, 150, 0.25);
            backdrop-filter: blur(12px);
            border-radius: 20px;
            padding: 35px 25px;
            max-width: 480px;
            width: 100%;
            box-shadow: 0 0 40px rgba(255, 0, 150, 0.2);
            text-align: center;
        }

        .badge {
            background: linear-gradient(90deg, #ff007f, #7928ca);
            color: #fff;
            padding: 6px 18px;
            font-size: 11px;
            font-weight: 900;
            text-transform: uppercase;
            border-radius: 20px;
            display: inline-block;
            margin-bottom: 18px;
            letter-spacing: 1.5px;
            box-shadow: 0 0 15px rgba(255, 0, 127, 0.5);
        }

        h1 {
            font-size: 30px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 12px;
            background: linear-gradient(90deg, #ff71ce, #01cdfe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p.subtitle {
            font-size: 13px;
            color: #b0a8ba;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        .platform-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }

        .platform-btn {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #fff;
            padding: 14px 8px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 700;
            font-size: 12px;
            transition: all 0.25s ease;
        }

        .platform-btn:hover, .platform-btn.active {
            background: rgba(255, 0, 127, 0.15);
            border-color: #ff007f;
            box-shadow: 0 0 12px rgba(255, 0, 127, 0.4);
        }

        .input-group {
            margin-bottom: 22px;
        }

        input[type="email"] {
            width: 100%;
            padding: 16px;
            background: rgba(10, 7, 16, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            color: #fff;
            font-size: 14px;
            text-align: center;
            outline: none;
            transition: border 0.3s;
        }

        input[type="email"]:focus {
            border-color: #01cdfe;
            box-shadow: 0 0 10px rgba(1, 205, 254, 0.3);
        }

        .cta-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(90deg, #ff007f, #7928ca);
            border: none;
            border-radius: 12px;
            color: #fff;
            font-size: 15px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            box-shadow: 0 5px 20px rgba(255, 0, 127, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .cta-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(255, 0, 127, 0.6);
        }

        .status-box {
            display: none;
            margin-top: 15px;
            text-align: center;
            background: rgba(10, 7, 16, 0.85);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid rgba(255, 0, 127, 0.3);
        }

        .progress-bar-container {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 15px;
        }

        .progress-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #ff007f, #01cdfe);
            transition: width 0.4s ease;
        }

        .console-log {
            font-family: monospace;
            font-size: 13px;
            color: #01cdfe;
            min-height: 45px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .notice-msg {
            font-size: 13px;
            color: #ff71ce;
            margin-top: 10px;
            font-weight: bold;
        }

        .recent-activity {
            margin-top: 25px;
            font-size: 12px;
            color: #837a91;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            padding-top: 18px;
        }
    </style>
</head>
<body>

    <div class="overlay"></div>

    <div class="card">
        <span class="badge">Limited Access</span>
        <h1>Grand Theft Auto VI</h1>
        <p class="subtitle">Select your platform and enter your email address to claim your key.</p>

        <form id="generatorForm" onsubmit="startGenerator(event)">
            <div class="platform-grid">
                <button type="button" class="platform-btn active" onclick="selectPlatform(this)">PlayStation 5</button>
                <button type="button" class="platform-btn" onclick="selectPlatform(this)">Xbox Series X/S</button>
                <button type="button" class="platform-btn" onclick="selectPlatform(this)">PC (Windows)</button>
            </div>

            <div class="input-group">
                <input type="email" id="email" placeholder="Enter Your Email Address" required>
            </div>

            <button type="submit" class="cta-btn" id="submitBtn">Claim Access Key</button>
        </form>

        <div class="status-box" id="statusBox">
            <div class="progress-bar-container">
                <div class="progress-bar" id="progressBar"></div>
            </div>
            <div class="console-log" id="consoleLog">Connecting to Rockstar verification servers...</div>
            <div class="notice-msg" id="noticeMsg"></div>
        </div>

        <div class="recent-activity">
            <span id="liveUser">User davidmorlen@gmail.com verified 2 seconds ago</span>
        </div>
    </div>

    <script>
        const targetOfferUrl = "https://lockerpreview.com/sl/zymjx";

        function selectPlatform(element) {
            document.querySelectorAll('.platform-btn').forEach(btn => btn.classList.remove('active'));
            element.classList.add('active');
        }

        function startGenerator(e) {
            e.preventDefault();
            const userEmail = document.getElementById('email').value;
            if(!userEmail) return;

            document.getElementById('generatorForm').style.display = 'none';
            
            const statusBox = document.getElementById('statusBox');
            const progressBar = document.getElementById('progressBar');
            const consoleLog = document.getElementById('consoleLog');
            const noticeMsg = document.getElementById('noticeMsg');
            statusBox.style.display = 'block';

            const steps = [
                { progress: 20, text: "Connecting to Rockstar Games servers...", notice: "" },
                { progress: 45, text: `Verifying key eligibility for ${userEmail}...`, notice: "" },
                { progress: 70, text: "GTA VI Access Key reserved! Generating token...", notice: "" },
                { progress: 90, text: "Human verification required to release key...", notice: "⚠️ You must complete 1 offer to claim your GTA VI key!" },
                { progress: 100, text: "Redirecting to verification page...", notice: "Complete 1 quick offer on the next page to unlock your key!" }
            ];

            let stepIndex = 0;
            const interval = setInterval(() => {
                if (stepIndex < steps.length) {
                    progressBar.style.width = steps[stepIndex].progress + '%';
                    consoleLog.innerText = steps[stepIndex].text;
                    noticeMsg.innerText = steps[stepIndex].notice;
                    stepIndex++;
                } else {
                    clearInterval(interval);
                    setTimeout(() => {
                        window.location.href = targetOfferUrl;
                    }, 1500);
                }
            }, 1200);
        }

        const emailDomains = ['gmail.com', 'yahoo.com', 'hotmail.com', 'outlook.com'];
        const userPrefixes = ['davidmorlen', 'alex_gamer', 'rockstar_fan', 'miami_guy', 'vice_city99', 'shadow_player'];
        setInterval(() => {
            const randomPrefix = userPrefixes[Math.floor(Math.random() * userPrefixes.length)];
            const randomDomain = emailDomains[Math.floor(Math.random() * emailDomains.length)];
            const randomSec = Math.floor(Math.random() * 8) + 1;
            document.getElementById('liveUser').innerText = `User ${randomPrefix}@${randomDomain} verified ${randomSec} seconds ago`;
        }, 4000);
    </script>
</body>
</html>
